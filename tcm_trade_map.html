<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>TCM Trade Flow Map (1953–1963)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f7f4ef; }
  #map { height: 100vh; width: 100%; }
  #controls {
    position: absolute; top: 10px; left: 10px; z-index: 1000;
    background: rgba(255, 255, 255, 0.92); color: #333; padding: 14px 18px;
    border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    max-width: 340px; font-size: 14px;
    backdrop-filter: blur(8px); border: 1px solid rgba(0,0,0,0.08);
  }
  #controls h2 { font-size: 18px; margin-bottom: 6px; color: #8b7355; }
  #controls .subtitle { font-size: 12px; color: #888; margin-bottom: 12px; }
  #controls label { display: block; margin-top: 10px; font-weight: 600; font-size: 12px; color: #666; }
  #controls select, #controls input[type=range] { width: 100%; margin-top: 4px; }
  #controls select {
    padding: 6px 8px; border-radius: 6px; border: 1px solid #ccc;
    background: #fff; color: #333; font-size: 13px;
  }
  #controls input[type=range] { accent-color: #8b7355; }
  #year-label { display: inline-block; background: #8b7355; color: #fff; padding: 2px 10px; border-radius: 12px; font-weight: 700; margin-left: 6px; }
  .info-panel {
    position: absolute; bottom: 20px; right: 10px; z-index: 1000;
    background: rgba(255,255,255,0.92); color: #555; padding: 10px 14px;
    border-radius: 8px; font-size: 11px; max-width: 260px;
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .legend { margin-top: 8px; }
  .legend-item { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-line { width: 24px; height: 2px; flex-shrink: 0; }
</style>
</head>
<body>
<div id="map"></div>
<div id="controls">
  <h2>TCM Export Flows</h2>
  <div class="subtitle">Traditional Chinese Medicine Exports 1953–1963</div>
  <label>Product
    <select id="product-select">
      <option value="all">All Products</option>
    </select>
  </label>
  <label>Year: <span id="year-label">ALL</span>
    <input type="range" id="year-slider" min="0" max="0" value="0" step="1">
  </label>
  <label style="color:#888;font-weight:400;margin-top:6px;">
    <input type="checkbox" id="show-flows" checked> Show Flow Lines
  </label>
  <label style="color:#888;font-weight:400;">
    <input type="checkbox" id="show-markers" checked> Show Destinations
  </label>
</div>
<div class="info-panel" id="info-panel">
  <strong style="color:#8b7355;">Legend</strong>
  <div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background:#d13e37;"></span> Musk</div>
    <div class="legend-item"><span class="legend-dot" style="background:#ad7300;"></span> Tiger Bone</div>
    <div class="legend-item"><span class="legend-dot" style="background:#dbb658;"></span> Deer Antler Velvet</div>
    <div class="legend-item"><span class="legend-dot" style="background:#5d6b8f;"></span> Deer Antler Horn</div>
    <div class="legend-item"><span class="legend-dot" style="background:#7b4b8a;"></span> Deer Tail</div>
    <div class="legend-item"><span class="legend-dot" style="background:#11495c;"></span> Antelope Horn</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

1.0}}]}, {"dest": "Malaysia", "iso": "MYS", "lat": 4.21, "lon": 101.98, "total": 3238.0, "products": [{"product": "Deer Antler Velvet", "unit": "taels", "total": 3136.0, "by_year": {"1956": 2816.0, "1957": 320.0}}, {"product": "Deer Tail", "unit": "kg", "total": 19.0, "by_year": {"1955": 3.0, "1956": 16.0}}, {"product": "Musk", "unit": "taels", "total": 32.0, "by_year": {"1956": 32.0}}, {"product": "Antelope Horn", "unit": "Not specified", "total": 51.0, "by_year": {"1958": 51.0}}]}, {"dest": "North Korea", "iso": "PRK", "lat": 40.34, "lon": 127.51, "total": 1589.0, "products": [{"product": "Musk", "unit": "taels", "total": 1555.0, "by_year": {"1955": 643.0, "1956": 320.0, "1957": 128.0, "1958": 64.0, "1959": 48.0, "1960": 96.0, "1961": 32.0, "1962": 64.0, "1963": 160.0}}, {"product": "Antelope Horn", "unit": "Not specified", "total": 22.0, "by_year": {"1958": 20.0, "1959": 2.0}}, {"product": "Tiger Bone", "unit": "kg", "total": 12.0, "by_year": {"1958": 12.0}}]}, {"dest": "Poland", "iso": "POL", "lat": 51.92, "lon": 19.15, "total": 1920.0, "products": [{"product": "Musk", "unit": "taels", "total": 1920.0, "by_year": {"1953": 480.0, "1954": 480.0, "1959": 800.0, "1960": 160.0}}]}, {"dest": "Russia", "iso": "RUS", "lat": 61.52, "lon": 105.32, "total": 1312.0, "products": [{"product": "Musk", "unit": "taels", "total": 1312.0, "by_year": {"1959": 640.0, "1960": 672.0}}]}, {"dest": "Switzerland", "iso": "CHE", "lat": 46.82, "lon": 8.23, "total": 133.3, "products": [{"product": "Musk", "unit": "taels", "total": 133.3, "by_year": {"1962": 69.3, "1963": 64.0}}]}, {"dest": "Thailand", "iso": "THA", "lat": 15.87, "lon": 100.99, "total": 5286.0, "products": [{"product": "Deer Antler Horn", "unit": "kg", "total": 421.0, "by_year": {"1956": 421.0}}, {"product": "Deer Antler Velvet", "unit": "taels", "total": 4864.0, "by_year": {"1956": 4864.0}}, {"product": "Antelope Horn", "unit": "Not specified", "total": 1.0, "by_year": {"1958": 1.0}}]}, {"dest": "United Kingdom", "iso": "GBR", "lat": 55.38, "lon": -3.44, "total": 157.4, "products": [{"product": "Musk", "unit": "taels", "total": 157.4, "by_year": {"1955": 64.0, "1962": 6.4, "1963": 87.0}}]}, {"dest": "Vietnam", "iso": "VNM", "lat": 14.06, "lon": 108.28, "total": 414.0, "products": [{"product": "Musk", "unit": "taels", "total": 410.0, "by_year": {"1959": 26.0, "1960": 128.0, "1961": 96.0, "1962": 64.0, "1963": 96.0}}, {"product": "Antelope Horn", "unit": "kg", "total": 4.0, "by_year": {"1959": 2.0, "1960": 2.0}}]}], "yearly": {"1953": {"France": 192.0, "Hong Kong": 10425.0, "Poland": 480.0}, "1954": {"France": 1152.0, "Hong Kong": 17925.0, "Poland": 480.0}, "1955": {"France": 96.0, "Germany": 320.0, "Hong Kong": 13117.0, "Malaysia": 3.0, "North Korea": 643.0, "United Kingdom": 64.0}, "1956": {"France": 1120.0, "Hong Kong": 11588.0, "Malaysia": 2864.0, "North Korea": 320.0, "Thailand": 5285.0}, "1957": {"Hong Kong": 14108.0, "Malaysia": 320.0, "North Korea": 128.0}, "1958": {"Hong Kong": 28767.0, "Malaysia": 51.0, "North Korea": 96.0, "Thailand": 1.0}, "1959": {"Hong Kong": 13674.0, "North Korea": 50.0, "Poland": 800.0, "Russia": 640.0, "Vietnam": 28.0}, "1960": {"Germany": 10.0, "Hong Kong": 6819.0, "North Korea": 96.0, "Poland": 160.0, "Russia": 672.0, "Vietnam": 130.0}, "1961": {"France": 0.6, "Hong Kong": 11035.0, "North Korea": 32.0, "Vietnam": 96.0}, "1962": {"France": 112.0, "Hong Kong": 9079.0, "North Korea": 64.0, "Switzerland": 69.3, "United Kingdom": 6.4, "Vietnam": 64.0}, "1963": {"Cuba": 68.0, "France": 497.0, "Hong Kong": 5150.0, "Japan": 451.0, "North Korea": 160.0, "Switzerland": 64.0, "United Kingdom": 87.0, "Vietnam": 96.0}}, "years": [1953, 1954, 1955, 1956, 1957, 1958, 1959, 1960, 1961, 1962, 1963], "products": ["Musk", "Tiger Bone", "Deer Antler Velvet", "Deer Antler Horn", "Deer Tail", "Antelope Horn"]};

const PRODUCT_COLORS = {
  "Musk": "#d13e37",
  "Tiger Bone": "#ad7300",
  "Deer Antler Velvet": "#dbb658",
  "Deer Antler Horn": "#5d6b8f",
  "Deer Tail": "#7b4b8a",
  "Antelope Horn": "#11495c",
};

const DEFAULT_FLOW_COLOR = "#5a5a5a";

// Init map
const map = L.map('map').setView([35, 85], 3);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19,
}).addTo(map);
 
const origin = DATA.origin;
let flowLines = [];
let markers = [];

// Build product select
const prodSelect = document.getElementById('product-select');
DATA.products.forEach(p => {
  const opt = document.createElement('option');
  opt.value = p;
  opt.textContent = p;
  prodSelect.appendChild(opt);
});

// Build year slider
const yearSlider = document.getElementById('year-slider');
const yearLabel = document.getElementById('year-label');
const years = DATA.years;
yearSlider.max = years.length;
yearSlider.value = years.length; // default "all"

function getYearFilter() {
  const idx = parseInt(yearSlider.value);
  if (idx >= years.length) return null; // all
  return years[idx];
}

function getProductFilter() {
  const v = prodSelect.value;
  if (v === 'all') return null;
  return v;
}

function getQuantity(destName, year, product) {
  const dest = DATA.destinations[destName];
  if (!dest) return 0;

  if (year !== null) {
    // specific year
    const yrData = dest.yearly[String(year)] || {};
    if (product !== null) {
      // need per-product-per-year from flow_data
      const fd = DATA.flow_data.find(f => f.dest === destName);
      if (!fd) return 0;
      let total = 0;
      fd.products.forEach(p => {
        if (product === null || p.product === product) {
          total += (p.by_year[String(year)] || 0);
        }
      });
      return total;
    }
    return yrData;
  }

  // all years
  if (product !== null) {
    const fd = DATA.flow_data.find(f => f.dest === destName);
    if (!fd) return 0;
    let total = 0;
    fd.products.forEach(p => {
      if (p.product === product) total += p.total;
    });
    return total;
  }
  return dest.total_qty;
}

function getFlowWidth(qty) {
  // scale: 0 -> 0, max (approx 30000) -> 8
  return Math.max(0.5, Math.min(8, Math.sqrt(qty) / 20));
}

function getFlowColor(destName, year, product) {
  // if specific product selected, use that product's color
  if (product !== null) return PRODUCT_COLORS[product] || DEFAULT_FLOW_COLOR;

  // All Products mode: use a single consistent color for all destinations
  return DEFAULT_FLOW_COLOR;
}

function getMarkerRadius(destName, year, product) {
  const qty = getQuantity(destName, year, product);
  return Math.max(4, Math.min(18, Math.sqrt(qty) / 8));
}

function render() {
  const year = getYearFilter();
  const product = getProductFilter();
  const showFlows = document.getElementById('show-flows').checked;
  const showMarkers = document.getElementById('show-markers').checked;

  yearLabel.textContent = year !== null ? String(year) : 'ALL';

  // Clear previous
  flowLines.forEach(l => map.removeLayer(l));
  markers.forEach(m => map.removeLayer(m));
  flowLines = [];
  markers = [];

  const maxQty = Math.max(...Object.values(DATA.flow_data).map(f => {
    let t = 0;
    f.products.forEach(p => {
      t += year !== null ? (p.by_year[String(year)] || 0) : p.total;
    });
    return t;
  }), 1);

  DATA.flow_data.forEach(fd => {
    const qty = getQuantity(fd.dest, year, product);
    if (qty <= 0) return;

    // Flow line (curved)
    if (showFlows) {
      const fromLatLng = [origin.lat, origin.lon];
      const toLatLng = [fd.lat, fd.lon];

      // Create a curved line by adding midpoint offset
      const midLat = (origin.lat + fd.lat) / 2;
      const midLon = (origin.lon + fd.lon) / 2;
      const offset = (fd.lon - origin.lon) * 0.15;
      const curvedMid = [midLat + offset * 0.1, midLon - offset];

      const line = L.polyline([fromLatLng, curvedMid, toLatLng], {
        color: getFlowColor(fd.dest, year, product),
        weight: getFlowWidth(qty),
        opacity: 0.7,
        smoothFactor: 2,
      }).addTo(map);
      line.bindTooltip(`<b>${fd.dest}</b><br>${product || 'All'}: ${qty.toLocaleString()}`, {sticky: true});
      flowLines.push(line);
    }

    // Destination marker
    if (showMarkers) {
      const mk = L.circleMarker([fd.lat, fd.lon], {
        radius: getMarkerRadius(fd.dest, year, product),
        fillColor: getFlowColor(fd.dest, year, product),
        color: '#fff',
        weight: 1.5,
        fillOpacity: 0.85,
      }).addTo(map);

      // Build tooltip with product breakdown
      let tipHtml = `<b>${fd.dest}</b><br>Total: ${qty.toLocaleString()}`;
      fd.products.forEach(p => {
        const pq = year !== null ? (p.by_year[String(year)] || 0) : p.total;
        if (pq > 0) {
          tipHtml += `<br><span style="color:${PRODUCT_COLORS[p.product]||'#aaa'}">&#9679;</span> ${p.product}: ${pq.toLocaleString()} ${p.unit}`;
        }
      });
      mk.bindTooltip(tipHtml);
      markers.push(mk);
    }
  });

  // Origin marker (China)
  const originMk = L.circleMarker([origin.lat, origin.lon], {
    radius: 8,
    fillColor: '#8b7355',
    color: '#fff',
    weight: 2,
    fillOpacity: 1,
  }).addTo(map);
  originMk.bindTooltip('<b>China (Origin)</b>');
  markers.push(originMk);
}

// Event listeners
prodSelect.addEventListener('change', render);
yearSlider.addEventListener('input', render);
document.getElementById('show-flows').addEventListener('change', render);
document.getElementById('show-markers').addEventListener('change', render);

// Initial render
render();
</script>
</body>
</html>
